name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      # Pinned to match the version the config was validated against, so local
      # and CI results are identical. Config: .markdownlint-cli2.jsonc
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.0 "**/*.md"

  link-check:
    # Non-blocking: reports broken links every run but does not fail the build.
    # The archived source (essays, tweets) references some deleted repos/posts;
    # this surfaces link rot without gating merges on it. See .lycheeignore.
    name: link-check (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reuse link results from earlier runs (lychee's --cache): a link checked
      # OK in the last day is not fetched again. Each run saves under its own sha
      # and restores the newest earlier cache, so results keep rolling forward.
      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --accept 200..=299,403,429
            --max-retries 2
            --retry-wait-time 2
            --timeout 20
            --exclude-loopback
            './**/*.md'
          fail: false
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
